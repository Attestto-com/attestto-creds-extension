name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT
        run: npx wxt prepare || true

      # ESLint is not yet installed/configured in this repo (no eslint dep, no
      # flat config) — tracked as infra debt under SOC-13. Keep the step visible
      # but non-blocking so Test + Build gate the PR until lint is set up.
      - name: Lint
        run: npm run lint:check
        continue-on-error: true

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
