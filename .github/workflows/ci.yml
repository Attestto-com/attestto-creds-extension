name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # SHA-pinned per SOC-13 (a mutable @v4 tag can be moved by a compromised
      # or coerced maintainer; a full commit SHA is immutable).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT
        run: npx wxt prepare || true

      # ESLint is not yet installed/configured in this repo (no eslint dep, no
      # flat config) — tracked as infra debt under SOC-13. Keep the step visible
      # but non-blocking so Test + Build gate the PR until lint is set up.
      - name: Lint
        run: npm run lint:check
        continue-on-error: true

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
